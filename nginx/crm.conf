# Nginx del CRM. Esto no estaba en el repo: vivia solo en el servidor, y por eso
# un limite equivocado no se podia ni ver ni arreglar desde aqui.
#
# Motivo de que exista este fichero, tarea #77: una gestora no podia mandar un
# dossier de 1,4 MB. Salia «Error 413» sin llegar a tocar Node — la aplicacion
# acepta 16 MB (multer, uploadWhatsapp), pero Nginx corta por defecto en 1 MB y
# rechaza la peticion antes. Con `client_max_body_size` sin poner, cualquier
# adjunto de mas de un mega se pierde y el error no dice nada.
#
# Se aplica en el servidor:
#   sudo cp nginx/crm.conf /etc/nginx/snippets/crm-limites.conf
#   # y en el server{} de 360crm.tech:  include snippets/crm-limites.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` antes de recargar, siempre: recargar con un fichero mal escrito
# tumba el sitio entero, no solo el CRM.

# 20 MB, no 16.
#
# El tope de la aplicacion son 16 MB de FICHERO, pero por el cable viaja mas: el
# sobre multipart, el pie del mensaje y las cabeceras. Con los dos numeros
# iguales, un fichero de 16 MB justos lo rechazaria Nginx antes de que multer
# pudiera decir «demasiado grande» — y volveriamos al 413 mudo, que es lo que se
# venia a quitar.
#
# Asi manda el limite de la aplicacion, que es el que sabe explicarse.
client_max_body_size 20m;

# Un adjunto grande por una linea lenta tarda mas que el minuto que Nginx espera
# por defecto. Sin esto, subir un video desde el movil corta a mitad con un 504.
client_body_timeout 120s;
