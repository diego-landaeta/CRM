# Moodle 5.2 de pruebas (el de ISECD e ISEF), solo en local, para probar el plugin local_crm (#679).
# Desde la 5.1 el código público va en `public/`: esta imagen de Moodle HQ lo detecta sola.
# El código de Moodle no viene en la imagen: se copia al volumen `codigo` (ver README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle-local
      POSTGRES_DB: moodle
    volumes: [db_data:/var/lib/postgresql/data]
  moodle:
    image: moodlehq/moodle-php-apache:8.3
    ports: ["127.0.0.1:8087:80"]
    volumes: [codigo:/var/www/html, moodledata:/var/www/moodledata]
    depends_on: [db]
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes: {db_data: {}, codigo: {}, moodledata: {}}
