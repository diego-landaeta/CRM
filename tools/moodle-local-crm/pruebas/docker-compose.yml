# Moodle 4.5 de pruebas, solo en local, para probar el plugin local_crm (#679).
services:
  mariadb:
    image: bitnamilegacy/mariadb:11.4
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MARIADB_USER: bn_moodle
      MARIADB_DATABASE: bitnami_moodle
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes: [mariadb_data:/bitnami/mariadb]
  moodle:
    image: bitnamilegacy/moodle:4.5
    ports: ["127.0.0.1:8085:8080"]
    environment:
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: bn_moodle
      MOODLE_DATABASE_NAME: bitnami_moodle
      ALLOW_EMPTY_PASSWORD: "yes"
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: "AdminLocal-679!"
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_NAME: Campus local CRM
      MOODLE_HOST: localhost:8085
    volumes: [moodle_data:/bitnami/moodle, moodledata_data:/bitnami/moodledata]
    depends_on: [mariadb]
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes: {mariadb_data: {}, moodle_data: {}, moodledata_data: {}}
